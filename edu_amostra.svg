<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" style="background:#fff;border:1px solid #cfd8d6;width:100%"><text x="24" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14282d">Conceito 3: Tamanho da Amostra e Intervalo de Confianca</text><line x1="320" y1="42" x2="320" y2="165" stroke="#b4531a" stroke-width="2" stroke-dasharray="4"/><text x="326" y="52" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b4531a">Zero (Sem vantagem)</text><rect x="140" y="68" width="340" height="18" fill="#e4ecea" stroke="#14282d"/><circle cx="345" cy="77" r="4" fill="#14282d"/><text x="24" y="81" font-family="sans-serif" font-size="10" fill="#14282d">Amostra pequena (N=40)</text><text x="24" y="100" font-family="sans-serif" font-size="9" fill="#4c5f63">Intervalo largo cruza o zero: resultado pode ser sorte</text><rect x="335" y="122" width="110" height="18" fill="#14282d"/><circle cx="390" cy="131" r="4" fill="#fff"/><text x="24" y="135" font-family="sans-serif" font-size="10" fill="#14282d">Amostra grande (N=1.000+)</text><text x="24" y="154" font-family="sans-serif" font-size="9" fill="#4c5f63">Intervalo estreito acima de zero: evidencia consistente</text><text x="24" y="184" font-family="sans-serif" font-size="10" fill="#4c5f63">Nota educativa. Resultados passados nao garantem resultados futuros.</text></svg>