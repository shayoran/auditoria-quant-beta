<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de Custos</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#0f172a;line-height:1.5}.nav{background:#0f172a;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.brand{font-weight:700;font-size:16px;color:#2dd4bf}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#cbd5e1;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:6px}.links a.on,.links a:hover{background:#1e293b;color:#fff}.wrap{max-width:960px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;margin-bottom:20px}.kbi{background:#0f172a;color:#fff;padding:16px;border-radius:10px;text-align:center;flex:1;min-width:160px}.kbi small{display:block;color:#94a3b8;font-size:11px;margin-bottom:4px}.kbi strong{font-size:20px;color:#2dd4bf}.kbi strong.red{color:#f87171}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.btn{padding:9px 14px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;display:inline-block}.btn.on,.btn.dark{background:#0f172a;color:#fff;border-color:#0f172a}input[type=range]{width:100%;accent-color:#0d9488;cursor:pointer}canvas{width:100%;height:240px;background:#0f172a;border-radius:10px;display:block;margin-top:14px}.note{background:#f0fdfa;border-left:4px solid #0d9488;padding:12px 16px;border-radius:6px;margin-top:16px;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}th,td{border:1px solid #e2e8f0;padding:10px;text-align:left}th{background:#0f172a;color:#fff}</style></head><body><nav class="nav"><div class="brand">Risk Reality Check</div><div class="links"><a href="index.html" class="">Inicio e Auditoria</a><a href="guia_iniciantes.html" class="">Comecar Aqui</a><a href="ficha01_donchian_h4.html" class="on">Simulador Custos</a><a href="licao02_amostra_acaso.html" class="">Academia e Acaso</a><a href="catalogo_estrategias.html" class="">Guia Indicadores</a></div></nav><div class="wrap"><div class="card"><h1>Simulador Universal de Custos (Spread, Comissoes e Swaps)</h1><label>Trades por Ano: <strong id="vT">300</strong></label><input type="range" id="sT" min="20" max="1500" step="10" value="300"><label>Tamanho Posicao (EUR): <strong id="vP">2000</strong></label><input type="range" id="sP" min="200" max="20000" step="100" value="2000"><label>Spread + Comissao (%): <strong id="vC">0.16%</strong></label><input type="range" id="sC" min="0.02" max="0.60" step="0.02" value="0.16"><label>Dias Aberto (Swaps): <strong id="vD">3 dias</strong></label><input type="range" id="sD" min="0" max="30" step="1" value="3"><canvas id="cvCost" width="860" height="220"></canvas><div class="row"><div class="kbi"><small>Comissoes + Spread</small><strong id="oSp">960 EUR</strong></div><div class="kbi"><small>Swaps</small><strong id="oSw">270 EUR</strong></div><div class="kbi"><small>Custo Total Anual</small><strong id="oTot" class="red">1230 EUR</strong></div></div></div><script>(function(){const g=id=>document.getElementById(id),cv=g("cvCost"),ctx=cv.getContext("2d");function up(){const t=+g("sT").value,p=+g("sP").value,c=+g("sC").value,d=+g("sD").value;g("vT").textContent=t;g("vP").textContent=p;g("vC").textContent=c.toFixed(2)+"%";g("vD").textContent=d+" dias";const sp=Math.round(t*p*(c/100)),sw=Math.round(t*p*0.00015*d),tot=sp+sw;g("oSp").textContent=sp+" EUR";g("oSw").textContent=sw+" EUR";g("oTot").textContent=tot+" EUR";ctx.fillStyle="#0f172a";ctx.fillRect(0,0,cv.width,cv.height);const maxV=Math.max(tot,1000);const bars=[{l:"Spread e Comissao",v:sp,col:"#2dd4bf"},{l:"Swaps",v:sw,col:"#38bdf8"},{l:"Impacto Total Anual",v:tot,col:"#f87171"}];bars.forEach((b,i)=>{const bw=Math.max(10,(b.v/maxV)*560),y=35+i*60;ctx.fillStyle=b.col;ctx.fillRect(210,y,bw,30);ctx.fillStyle="#fff";ctx.font="13px sans-serif";ctx.fillText(b.l,20,y+21);ctx.fillText(b.v+" EUR",220+bw,y+21);});}["sT","sP","sC","sD"].forEach(id=>g(id).addEventListener("input",up));up();})();</script></div></body></html>
