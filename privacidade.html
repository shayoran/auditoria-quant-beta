<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dados Locais & Privacidade Técnica — Auditoria Quant</title><link rel="stylesheet" href="atlas_base.css"></head><body><nav class="atlas-nav"><a href="index.html">Auditar (Monte Carlo)</a> <a href="academia.html">Academia</a> <a href="guia_1.html">Guia 1: Padrões</a> <a href="guia_2.html">Guia 2: Risco</a> <a href="guia_3.html">Guia 3: Checklist</a> <a href="guia_4.html">Guia 4: Diário</a> <a href="bot01.html">Bot 01</a> <a href="beta.html">Beta & Feedback</a></nav><main class="atlas-main"><section class="atlas-card"><h1>Dados Locais, APIs Públicas & Privacidade Técnica do Site</h1><p style="font-size:13px;color:#93c5fd>Para a política RGPD relativa ao envio de emails do programa Beta, consulta a página separada: <a href="rgpd_email.html">Política RGPD (Serviço por Email)</a>.</p><ul style="font-size:14px><li><b>Armazenamento Local (localStorage / sessionStorage):</b> Todos os registos do diário, simulações, preferências e feedback são guardados apenas no teu navegador sob o prefixo <code>aq_*</code>.</li><li><b>API Pública Binance [R]:</b> O navegador consulta diretamente endpoints públicos (<code>api.binance.com</code> e <code>fapi.binance.com</code>) para cotações e métricas de mercado, sem envio de dados pessoais do utilizador.</li><li><b>Reconhecimento de Voz (Desligado por Defeito):</b> No Guia 4, o microfone permanece desligado até clique explícito. Quando ativado, o navegador pode transmitir áudio aos servidores da Google/fornecedor do browser para transcrição.</li><li><b>Widgets de Terceiros (Sob Demanda):</b> O calendário económico TradingView só é carregado quando clicas no botão respetivo; ligações externas (Forex Factory, CoinGlass, Crypto Bubbles) abrem em separador próprio sem rastreamento embutido.</li><li><b>Zero Cookies de Publicidade:</b> Não utilizamos cookies de rastreamento publicitário nem perfis comportamentais.</li></ul><button type="button" id="btn_limpar_aq" class="aq-btn-44" style="border-color:#ef4444;color:#fca5a5">Apagar Apenas Dados Locais deste Site (chaves aq_*)</button><p id="msg_limpar_aq" style="font-size:13px;color:#4ade80;margin-top:8px></p></section></main><footer id="atlas_footer_v21" class="atlas-footer"></footer><script src="atlas_prefs.js"></script></body></html>
